services:
  web:
    build: ./dockerfiles/
    container_name: HirePurchaseSystem
    platform: linux/x86_64
    depends_on:
      - db
    ports:
      - "8069:8069"
      - "8072:8072"
    restart: always
    mem_limit: 1500m
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./extraaddons:/mnt/extra-addons
    environment:
      - PASSWORD_FILE=/run/secrets/postgresql_password
    secrets:
      - postgresql_password  
    command: > 
      odoo
      --workers=2
      --gevent-port=8072
      --proxy-mode
      --limit-time-cpu=60
      --limit-time-real=120
      --limit-memory-hard=1200000000
      --limit-memory-soft=1000000000
      --limit-request=8192
  db:
    image: postgres:latest
    container_name: hirepurchasesystemdb
    platform: linux/x86_64
    shm_size: '256mb'
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgresql_password
      - POSTGRES_USER=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"  
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    secrets:
      - postgresql_password  
  pgadmin:
    image: dpage/pgadmin4
    restart: always
    ports:
      - "8860:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: johnbolt651@gmail.com
      PGADMIN_DEFAULT_PASSWORD: odoo
    volumes:
      - pgadmin-data:/var/lib/pgadmin 
volumes:
  odoo-web-data:
  odoo-db-data:
  pgadmin-data:
secrets:
  postgresql_password:
    file: odoo_pg_pass